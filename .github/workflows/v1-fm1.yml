name: VG-1 FM1 / original Vanguard recreation validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1-fm1-engine
      - feature/vanguard1-recreation
    paths:
      - 'firmware/v1/**'
      - 'tests/v1_core_smoke.c'
      - 'tests/vg1_render.c'
      - 'tests/vg1_gate_smoke.c'
      - 'tools/vg1_audio_report.py'
      - 'tools/build.py'
      - '.github/workflows/v1-fm1.yml'

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile new DSP engine independently of firmware
        run: gcc -std=c11 -O2 -Wall -Wextra -o /tmp/v1_smoke tests/v1_core_smoke.c
      - name: Validate Vanguard 1 waveforms, filters, FAT stereo, amp, trancegate, arp and glide
        run: /tmp/v1_smoke
      - name: Compile and run anti-click Trancegate contour tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -o /tmp/vg1_gate_smoke tests/vg1_gate_smoke.c
          /tmp/vg1_gate_smoke

  audio-reference:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile exact firmware core and preset bank for desktop WAV playback
        run: gcc -std=c11 -O2 -Wall -Wextra -o /tmp/vg1_render tests/vg1_render.c
      - name: Render eight presets and 31 oscillator modes at 44.1kHz stereo
        run: /tmp/vg1_render build/vg1-audio
      - name: Audit silence, clipping, stereo, spectral signatures and preset identity
        run: python3 tools/vg1_audio_report.py build/vg1-audio
      - name: Publish listenable VG-1 oscillator and preset audio
        uses: actions/upload-artifact@v4
        with:
          name: VG1-Vanguard1-Audio-Reference
          path: build/vg1-audio/
          if-no-files-found: error

  firmware:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install Pillow
      - name: Download JieLi compiler
        run: sh tools/get_toolchain.sh
      - name: Download pinned AC79 SDK
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            if timeout 180s git clone --depth 1 --single-branch \
              --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git \
              "$HOME/fw-AC79_AIoT_SDK"; then
              break
            fi
          done
          test -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"
      - name: Build separate V-1 FM1 firmware
        run: BOARD=fm1 VG1_FM1=1 sh build.sh
      - name: Verify output
        run: test -s build/vg1-fm1.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: VG1-Vanguard1-FM1-experimental
          path: build/vg1-fm1.fwsc
          if-no-files-found: error
